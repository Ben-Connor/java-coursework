name: Pytest Unit Tests

env:
  ENVIRONMENT: test

  BACKEND_BASE_URL: localhost:8000/
  FRONTEND_BASE_URL: localhost:3000/

  PYTHONUNBUFFERED: 1

  DATABASE_URL: sqlite://
  IS_SQLITE: True

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
    push:
        branches:
            - dev
            - prod

jobs:
    pytest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4.2

            - name: Set up Python
              uses: actions/setup-python@v5.5
              with:
                  python-version: 3.13

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -

            - name: Install dependencies
              run: |
                  cd backend
                  poetry install

            - name: Run pytest
              run: |
                  cd backend
                  make test
