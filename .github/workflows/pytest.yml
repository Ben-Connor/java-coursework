name: pytest Unit Tests

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
    push:
        branches:
            - dev
            - prod

jobs:
    mypy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4.2

            - name: Set up Python
              uses: actions/setup-python@v5.5
              with:
                  python-version: 3.13

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -

            - name: Install dependencies
              run: |
                  cd backend
                  poetry install

            - name: Run pytest
              run: |
                  cd backend
                  make test
