name: MyPy Static Type Checking

on:
  pull_request:
    branches:
      - dev
      - prod

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: |
          cd backend
          poetry install

      - name: Run MyPy
        run: |
          cd backend
          poetry run mypy
