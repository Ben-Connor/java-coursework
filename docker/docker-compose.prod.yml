services:
  fastapi-backend:
    container_name: macromotions-backend-prod
    build:
      context: ../backend
      dockerfile: ./docker/prod.Dockerfile
    env_file:
      - ../backend/env/.env.prod
    restart: always
    ports:
      - 8000:8000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  react-frontend:
    container_name: macromotions-frontend-prod
    build:
      context: ../frontend
      dockerfile: ../frontend/docker/prod.Dockerfile
    env_file:
      - ../frontend/env/.env.prod
    volumes:
      - /app/node_modules
    restart: always
    ports:
      - 80:80
    networks:
      - app-network
    depends_on:
      fastapi-backend:
        condition: service_healthy


networks:
  app-network:
    driver: bridge
